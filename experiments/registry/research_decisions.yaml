schema_version: 1
decision_status: frozen
frozen_at: "2026-09-23"

language:
  primary: en
  benchmark_track: english
  non_english_policy: separate_track_only
  asr_primary_metric: wer
  asr_secondary_metrics: [cer, macro_talk_wer]
  normalization_contract: english_v1_to_freeze_in_phase2

outputs:
  summary_package: multimodal_text_and_visual
  shared_event_evidence_timeline: true
  derived_dataset_export: true
  derived_dataset_field_roles:
    - source_metadata
    - ground_truth
    - prediction
    - evidence
  predictions_may_be_ground_truth: false

summary_budgets:
  short: 0.05
  medium: 0.10
  long: 0.20
  text_denominator: transcript_word_count
  visual_denominator: source_video_duration

ground_truth:
  policy: official_or_preexisting_labels_only
  project_manual_annotation_allowed: false
  pseudo_labels_allowed_for_official_evaluation: false
  heuristic_references_allowed_for_official_evaluation: false
  missing_label_action: fallback_or_not_eligible

speaker_diarization:
  scope: future_ready_only
  official_benchmark: false
  selection_gate: false
  deferred_metrics: [der, jer, cpwer]

compute_profiles:
  - id: colab_t4
    purpose: heavy_tasks
    accelerator: nvidia_t4
    leaderboard_scope: separate
  - id: local_rtx4050_6gb
    purpose: light_tasks_and_local_smoke
    accelerator: nvidia_rtx_4050
    vram_gb: 6
    leaderboard_scope: separate

model_policy:
  default: open_source
  llm_api_exception:
    allowed_providers: [groq, openrouter]
    stage_policy: llm_stages_only
    justification_required: true
    exact_model_and_date_required: true
    token_cost_rate_limit_cap_required: true
    deterministic_fallback_required: true
    missing_cap_status: blocked_decision
    compare_api_and_local_efficiency_together: false

large_dataset_policy:
  # VISTA full corpus frozen as a registered unavailable entry (D0).
  # Encoding closes criterion #2 in plans/260925-1537-dataset-coverage-expansion.
  # Schema must stay in sync with experiments/registry/contract_validator.py
  # expected_sections["large_dataset_policy"] (exact-match validation).
  vista_full:
    dataset_id: vista_full
    hf_dataset: "dongqi-me/VISTA"
    access_status: unavailable
    acquisition_level: D0
    fallback_dataset: null
    reason: "1.93 TB (18,606 video files) exceeds local 109.6 GB peak disk budget by ~17x; streaming probe gated by 401 Unauthorized; license=unknown."
    evidence:
      probe_output: "plans/260830-1917-scientific-benchmark/probes/output/vista_summary.json"
      decision_date: "2026-09-25"
      adjudicated_by: "phi-hung"
    allowed_alternatives:
      - labeled_subset
      - registered_fallback_dataset
      - separately_approved_external_storage_profile
    re_adjudication_required_if:
      - storage_budget_increases_above_2tb
      - license_resolved_to_official_open

phase2_dataset_execution:
  first_target:
    dataset_id: tedlium3
    track_id: asr_english
    qualification_compute_profile: local_rtx4050_6gb
    acquisition_policy: existing_local_integrity_scan_only
    source_of_truth: local
    split_mapping:
      official_dev: validation
      official_test: final_test
      preserve_original_split: true
  artifact_formats:
    unit_level: parquet
    aggregate: csv
    manifests: json
  next_target:
    dataset_id: iiit_cvid
    endpoint: ocr
  downstream_execution:
    prerequisite: d2_validated
    asr_model_benchmark_compute_profile: colab_t4
    asr_ablation_compute_profile: colab_t4
  artifact_transport:
    provider: google_drive
    logical_root: MyDrive
    role: immutable_artifact_transport
  run_control:
    target_run_minutes: 60
    checkpoint_policy: adaptive
    log_format: jsonl
    log_granularity: per_task_detailed
    long_task_progress_required: true
